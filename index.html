<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Мои ссылки и социальные сети">
  <title>Твои ссылки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="page">
    <section class="profile" aria-label="Профиль и ссылки">
      <div class="avatar-wrap reveal">
        <!-- Замени букву на первую букву своего ника или вставь изображение вместо .avatar-letter -->
        <div class="avatar" aria-label="Аватар">
          <span class="avatar-letter">?</span>
        </div>
        <span class="online-dot" title="Онлайн-статус (декоративный)"></span>
      </div>

      <p class="eyebrow reveal"><span class="eyebrow-line"></span> YOUR CORNER OF THE INTERNET <span class="eyebrow-line"></span></p>
      <h1 class="name reveal">ТВОЙ <span>НИК</span></h1>
      <p class="bio reveal">Пара слов о тебе. Замени этот текст на своё описание.</p>

      <div class="socials reveal" aria-label="Социальные сети">
        <!-- Замени # на полные ссылки на свои профили. Удали ненужные кнопки. -->
        <a class="social-link" href="#" aria-label="Telegram" title="Telegram" data-placeholder>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 4.6 18.2 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.6 13.5.7 12c-1.1-.3-1.1-1 .2-1.5L20 3.1c.9-.3 1.7.2 1.4 1.5Z"/></svg>
        </a>
        <a class="social-link" href="#" aria-label="Instagram" title="Instagram" data-placeholder>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="solid" cx="17.5" cy="6.7" r="1"/></svg>
        </a>
        <a class="social-link" href="#" aria-label="Discord" title="Discord" data-placeholder>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.7 5.2A18 18 0 0 0 15.3 4l-.5 1a16 16 0 0 0-5.6 0l-.5-1a18 18 0 0 0-4.4 1.2C1.5 9.3.8 13.3 1.2 17.3a18 18 0 0 0 5.4 2.7l1.2-2a11 11 0 0 1-1.9-.9l.5-.4a12.8 12.8 0 0 0 11.2 0l.5.4a11 11 0 0 1-1.9.9l1.2 2a18 18 0 0 0 5.4-2.7c.5-4.6-.8-8.6-3.1-12.1ZM8.8 14.5c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm6.4 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>
        </a>
        <a class="social-link" href="#" aria-label="YouTube" title="YouTube" data-placeholder>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.7V8.3l6.3 3.7-6.3 3.7Z"/></svg>
        </a>
      </div>

      <div class="section-heading reveal">
        <span class="section-mark"></span>
        <span>FIND ME HERE</span>
        <span class="section-mark"></span>
      </div>

      <nav class="link-list" aria-label="Основные ссылки">
        <!-- Скопируй блок .link-card, чтобы добавить новую ссылку. Замени href, название и подпись. -->
        <a class="link-card reveal" href="#" data-placeholder>
          <span class="link-icon icon-telegram" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M21.4 4.6 18.2 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.6 13.5.7 12c-1.1-.3-1.1-1 .2-1.5L20 3.1c.9-.3 1.7.2 1.4 1.5Z"/></svg>
          </span>
          <span class="link-copy"><strong>Telegram</strong><small>Мой канал или профиль</small></span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link-card reveal" href="#" data-placeholder>
          <span class="link-icon icon-instagram" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="solid" cx="17.5" cy="6.7" r="1"/></svg>
          </span>
          <span class="link-copy"><strong>Instagram</strong><small>Фото и повседневность</small></span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link-card reveal" href="#" data-placeholder>
          <span class="link-icon icon-discord" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M19.7 5.2A18 18 0 0 0 15.3 4l-.5 1a16 16 0 0 0-5.6 0l-.5-1a18 18 0 0 0-4.4 1.2C1.5 9.3.8 13.3 1.2 17.3a18 18 0 0 0 5.4 2.7l1.2-2a11 11 0 0 1-1.9-.9l.5-.4a12.8 12.8 0 0 0 11.2 0l.5.4a11 11 0 0 1-1.9.9l1.2 2a18 18 0 0 0 5.4-2.7c.5-4.6-.8-8.6-3.1-12.1ZM8.8 14.5c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm6.4 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>
          </span>
          <span class="link-copy"><strong>Discord</strong><small>Мой сервер или профиль</small></span>
          <span class="link-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>

      <footer class="footer reveal">
        <span class="footer-dot"></span>
        <span>MADE WITH INTENTION</span>
        <span class="footer-dot"></span>
      </footer>
    </section>
  </main>
</body>
</html>
